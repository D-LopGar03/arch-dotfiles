listener {
    timeout = 60                                 # 1 minuto
    on-timeout = brightnessctl set 5%            # Baja el brillo de la pantalla al mínimo
    on-resume = brightnessctl set 50%            # Recupera el brillo al mover el mouse
}

listener {
    timeout = 65                                 # 1 minuto
    on-timeout = hyprctl dispatch dpms off        # Apaga por completo la señal de la pantalla (Ahorro masivo)
    on-resume = hyprctl dispatch dpms on          # Enciende la pantalla al regresar
}

listener {
    timeout = 80                                 # 10 minutos
    on-timeout = systemctl suspend                # Suspende la laptop por completo
}

