background {
    monitor =
    path = $wallpaper
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
    blur_size = 4
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.15
    outer_color = rgb(45, 90, 100)        # tu ring-color 455a64
    inner_color = rgba(0, 0, 0, 0.53)    # tu inside-color 00000088
    font_color = rgb(255, 193, 7)         # tu text-color ffc107
    check_color = rgb(190, 80, 70)        # tu key-hl-color be5046
    fade_on_empty = true
    placeholder_text = <i>Insert Coin...</i>
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 193, 7, 0.9)
    font_size = 64
    font_family = JetBrains Mono
    position = 0, 200
    halign = center
    valign = center
}
