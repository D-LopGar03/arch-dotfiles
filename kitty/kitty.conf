#enabled_layouts splits,grid

#startup_session ~/.config/kitty/startup.conf

# DONT CONFIRM ON CLOSE

confirm_close no

resize_in_steps yes


# BEGIN_KITTY_THEME
#Midsummer Night
#include current-theme.conf
include /home/ay4t0/.config/kitty/dark-theme.auto.conf
# END_KITTY_THEME
window_margin_width 4
window_margin_height 4
background_opacity 0.9
font_size 12.0
font_family MesloLGS NF

shell /bin/zsh

# DISABLE BELL SOUND

enable_audio_bell no

enabled_layouts splits

# Dividir Horizontalmente (Arriba/Abajo)
map ctrl+shift+d launch --location=hsplit

# Dividir Verticalmente (Izquierda/Derecha)
map ctrl+shift+r launch --location=vsplit

# Navegar entre ventanas con Ctrl+Shift+Flechas
map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window top
map ctrl+down neighboring_window bottom


