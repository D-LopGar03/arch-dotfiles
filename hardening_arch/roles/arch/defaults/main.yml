# =====================================================================
# Hardening Sysctl
# =====================================================================
sysctl_hardening:
  dev.tty.ldisc_autoload: "0"
  fs.protected_fifos: "2"
  fs.protected_regular: "2"
  fs.suid_dumpable: "0"
  kernel.kptr_restrict: "2"
  kernel.randomize_va_space: "2"
  kernel.core_pattern: "|/bin/false"
  kernel.sysrq: "0"
  kernel.unprivileged_bpf_disabled: "1"
  kernel.yama.ptrace_scope: "1"
  net.core.bpf_jit_harden: "2"
  net.ipv4.conf.all.accept_redirects: "0"
  net.ipv4.conf.default.accept_redirects: "0"
  net.ipv4.conf.all.send_redirects: "0"
  net.ipv4.conf.all.log_martians: "1"
  net.ipv4.conf.default.log_martians: "1"
  net.ipv4.conf.all.rp_filter: "1"
  net.ipv6.conf.all.accept_redirects: "0"
  net.ipv6.conf.default.accept_redirects: "0"
  


# =====================================================================
# Bloqueo de módulos innecesarios
# =====================================================================

modulos_bloqueados:
  - dccp
  - sctp
  - rds
  - tipc
  - cramfs
  - freevxfs
  - hfs
  - hfsplus
  - jffs2
  - firewire-sbp2
  - firewire-core
  - firewire-ohci
  - sbsh


# =====================================================================
# Modulejail
# =====================================================================

modulejail_profile: "firewall"  # Opciones: minimal, conservative, desktop, firewall


# =====================================================================
# IP KDE Connect
# =====================================================================
kde_connect_source_ip: "192.168.0.10"



# 1. Navegadores nativos de Arch (Usarán AppArmor)
apparmor_native_browsers:
  - "firefox"
  - "vivaldi"

apparmor_enforce_profiles: "{{ apparmor_native_browsers | map('regex_replace', '^', '/usr/bin/') | list }}"

# 2. Navegadores Flatpak (Usarán endurecimiento de Flatpak overrides)
flatpak_browsers:
  - "com.brave.Browser"


#========================================
# Usuario 
#========================================

# Detecta automáticamente al usuario real que ejecuta el script, sin importar su nombre
entorno_usuario: "{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['user_id']) }}"

# El HOME también debe ser dinámico basándose en ese usuario
entorno_home: "/home/{{ entorno_usuario }}"


#========================================
# Dotfiles 
#========================================

dotfiles_repo_dir: "{{ playbook_dir }}/.."

dotfiles_config:
  - "hypr"
  - "kitty"
  - "ranger"
  - "rofi"
  - "swaync"
  - "waybar"
  - "wallpapers"
  - "dolphinrc"
  - "nvim"
  - "nwg-look"
  - "gtk-3.0"
  - "gtk-4.0"
  - "Kvantum"

# Paquetes oficiales de Pacman
pacman_packages:
  - networkmanager
  - network-manager-applet
  - obsidian
  - virtualbox
  - virtualbox-host-dkms
  - waybar
  - remmina
  - rofi
  - awww
  - keepassxc  
  - vivaldi
  - flatpak
  - papirus-icon-theme
  - swaync
  - hyprlock
  - brightnessctl
  - digikam
  - imagemagick
  - poppler
  - gimp
  - zsh
  - cava
  - ranger
  - gtk3
  - gtk4
  - kdeconnect
  - ttf-hack-nerd
  - ttf-nerd-fonts-symbols
  - ttf-meslo-nerd 
  - sof-firmware
  - alsa-ucm-conf
  - alsa-card-profiles
  - alsa-utils
  - hypridle
  - tlp
  - nvim
  - hyprshot
  - noto-fonts-emoji
  - rsync
  - kde-cli-tools
  - archlinux-xdg-menu
  - libreoffice-fresh
  - qt6ct
  - breeze
  - kvantum
  - docker
  - docker-compose
  - exfatprogs
  - nwg-look
  - kvantum-theme-materia
  - gsmartcontrol
  - udiskie
  
# Aplicaciones Flatpak
flatpak_packages:
  - com.vscodium.codium
  - com.brave.Browser
  - com.github.tchx84.Flatseal


# Módulos de almacenamiento autorizados que se cargarán en el arranque
kernel_storage_whitelist:
  - exfat
  - ext4
  - vfat 
  

# Variables TLP 

# 1. Configuraciones de CPU y rendimiento comunes
tlp_generic_settings:
  - { key: 'CPU_BOOST_ON_BAT', value: '0' }
  - { key: 'CPU_HWP_DYN_BOOST_ON_BAT', value: '0' }
  - { key: 'CPU_SCALING_GOVERNOR_ON_BAT', value: 'powersave' }
  - { key: 'CPU_ENERGY_PERF_POLICY_ON_BAT', value: 'balance_power' }

# 2. Selección dinámica nativa (Evita strings JSON y mantiene el tipado de lista)
tlp_battery_thresholds: >-
  {% if 'ASUS' in (ansible_facts['chassis_vendor'] | default('')) or 'ASUSTeK' in (ansible_facts['chassis_vendor'] | default('')) %}
    - key: "STOP_CHARGE_THRESH_BAT0"
      value: "80"
  {% elif 'Lenovo' in (ansible_facts['chassis_vendor'] | default('')) or 'ThinkPad' in (ansible_facts['chassis_vendor'] | default('')) %}
    - key: "START_CHARGE_THRESH_BAT0"
      value: "75"
    - key: "STOP_CHARGE_THRESH_BAT0"
      value: "80"
  {% elif 'Huawei' in (ansible_facts['chassis_vendor'] | default('')) %}
    - key: "STOP_CHARGE_THRESH_BAT0"
      value: "80"
  {% else %}
    []
  {% endif %}
