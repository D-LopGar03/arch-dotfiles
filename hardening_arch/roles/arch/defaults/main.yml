  - network-manager-applet
  - obsidian
  - virtualbox
  - virtualbox-host-dkms
  - waybar
  - remmina
  - rofi
  - awww
  - keepassxc  
  - vivaldi
  - flatpak
  - papirus-icon-theme
  - swaync
  - hyprlock
  - brightnessctl
  - digikam
  - imagemagick
  - poppler
  - gimp
  - zsh
  - cava
  - ranger
  - gtk3
  - gtk4
  - kdeconnect
  - ttf-hack-nerd
  - ttf-nerd-fonts-symbols
  - ttf-meslo-nerd 
  - sof-firmware
  - alsa-ucm-conf
  - alsa-card-profiles
  - alsa-utils
  - hypridle
  - tlp
  - nvim
