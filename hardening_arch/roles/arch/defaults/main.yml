# =====================================================================
# Hardening Sysctl
# =====================================================================
sysctl_hardening:
  dev.tty.ldisc_autoload: "0"
  fs.protected_fifos: "2"
  fs.protected_regular: "2"
  fs.suid_dumpable: "0"
  kernel.kptr_restrict: "2"
  kernel.randomize_va_space: "2"
  kernel.core_pattern: "|/bin/false"
  kernel.sysrq: "0"
  kernel.unprivileged_bpf_disabled: "1"
  kernel.yama.ptrace_scope: "1"
  net.core.bpf_jit_harden: "2"
  net.ipv4.conf.all.accept_redirects: "0"
  net.ipv4.conf.default.accept_redirects: "0"
  net.ipv4.conf.all.send_redirects: "0"
  net.ipv4.conf.all.log_martians: "1"
  net.ipv4.conf.default.log_martians: "1"
  net.ipv4.conf.all.rp_filter: "1"
  net.ipv6.conf.all.accept_redirects: "0"
  net.ipv6.conf.default.accept_redirects: "0"
  


# =====================================================================
# Bloqueo de módulos innecesarios
# =====================================================================

modulos_bloqueados:
  - dccp
  - sctp
  - rds
  - tipc
  - cramfs
  - freevxfs
  - hfs
  - hfsplus
  - jffs2
  - firewire-sbp2
  - firewire-core
  - firewire-ohci
  - sbsh


# =====================================================================
# Modulejail
# =====================================================================

modulejail_profile: "firewall"  # Opciones: minimal, conservative, desktop, firewall


# =====================================================================
# IP KDE Connect
# =====================================================================
kde_connect_source_ip: "192.168.0.10"



# 1. Navegadores nativos de Arch (Usarán AppArmor)
apparmor_native_browsers:
  - "firefox"
  - "vivaldi"

apparmor_enforce_profiles: "{{ apparmor_native_browsers | map('regex_replace', '^', '/usr/bin/') | list }}"

# 2. Navegadores Flatpak (Usarán endurecimiento de Flatpak overrides)
flatpak_browsers:
  - "com.brave.Browser"


#========================================
# Usuario 
#========================================

# Detecta automáticamente al usuario real que ejecuta el script, sin importar su nombre
entorno_usuario: "{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['user_id']) }}"

# El HOME también debe ser dinámico basándose en ese usuario
entorno_home: "/home/{{ entorno_usuario }}"


#========================================
# Dotfiles 
#========================================

dotfiles_repo_dir: "{{ playbook_dir }}/.."

dotfiles_config_links:
  - "hypr"
  - "kitty"
  - "ranger"
  - "rofi"
  - "swaync"
  - "waybar"
  - "wallpapers"
  - "dolphinrc"

