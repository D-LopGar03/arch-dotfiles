---
# =====================================================================
# Optimización de Batería: TLP + Hyprland en Arch Linux
# =====================================================================

- name: Batería | Asegurar que TLP y las utilidades esenciales están instalados
  community.general.pacman:
    name:
      - tlp
      - tlp-rdw  # Necesario para gestionar radio ya que bloqueas systemd-rfkill
      - hypridle # Gestor oficial de inactividad para Hyprland
    state: present
  tags: [battery, power]

- name: Batería | Desactivar servicios conflictivos (Recomendado por TLP)
  ansible.builtin.systemd_service:
    name: "{{ item.name }}"
    enabled: false
    state: stopped
    masked: "{{ item.mask }}"
  loop:
    - { name: 'power-profiles-daemon.service', mask: true } # Conflicto directo con TLP
    - { name: 'systemd-rfkill.service', mask: true }        # Evita que systemd pise el control de RF
    - { name: 'systemd-rfkill.socket', mask: true }
  ignore_errors: true
  tags: [battery, power]

- name: Batería | Ajustar la configuración de TLP para el rendimiento de Hyprland
  ansible.builtin.lineinfile:
    path: /etc/tlp.conf
    regexp: "^#?{{ item.key }}="
    line: "{{ item.key }}=\"{{ item.value }}\""
    create: yes
    mode: '0644'
  # Combinamos la lista estática con la dinámica procesada como YAML nativo
  loop: "{{ tlp_generic_settings + (tlp_battery_thresholds | from_yaml) }}"
  register: tlp_config
  tags: [battery, power]

- name: Batería | Iniciar y asegurar el servicio activo de TLP
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - tlp.service
  tags: [battery, power]

- name: Batería | Aplicar cambios de configuración de TLP inmediatamente
  when: tlp_config.changed
  ansible.builtin.command: tlp start
  tags: [battery, power]
