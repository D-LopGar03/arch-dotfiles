---
# =====================================================================
# Optimización de Batería: TLP + Hyprland en Arch Linux
# =====================================================================

- name: Batería | Asegurar que TLP y las utilidades esenciales están instalados
  community.general.pacman:
    name:
      - tlp
      - hypridle # Gestor oficial de inactividad para Hyprland
    state: present
  notify: Iniciar servicio TLP  
  tags: [battery, power]

- name: Batería | Desactivar servicios conflictivos (Recomendado por TLP)
  ansible.builtin.systemd_service:
    name: "{{ item.name }}"
    enabled: false
    state: stopped
    masked: "{{ item.mask }}"
  loop:
    - { name: 'power-profiles-daemon.service', mask: true } # Conflicto directo con TLP
    - { name: 'systemd-rfkill.service', mask: true }        # TLP maneja mejor los estados de radio (Wi-Fi/BT)
    - { name: 'systemd-rfkill.socket', mask: true }
  ignore_errors: true
  tags: [battery, power]

- name: Batería | Ajustar la configuración de TLP para el rendimiento de Hyprland
  ansible.builtin.lineinfile:
    path: /etc/tlp.conf
    regexp: "^#?{{ item.key }}="
    line: "{{ item.key }}=\"{{ item.value }}\""
    create: yes
    mode: '0644'
  loop: "{{ tlp_generic_settings + (tlp_battery_thresholds | from_json) }}"
  register: tlp_config
  tags: [battery, power]
  vars:
    # 1. Configuraciones de CPU y rendimiento comunes
    tlp_generic_settings:
      - { key: 'CPU_BOOST_ON_BAT', value: '0' }
      - { key: 'CPU_HWP_DYN_BOOST_ON_BAT', value: '0' }
      - { key: 'CPU_SCALING_GOVERNOR_ON_BAT', value: 'powersave' }
      - { key: 'CPU_ENERGY_PERF_POLICY_ON_BAT', value: 'balance_power' }

    # 2. Selección dinámica usando la sintaxis moderna de ansible_facts y filtro JSON
    tlp_battery_thresholds: >-
      {% if 'ASUS' in (ansible_facts['chassis_vendor'] | default('')) or 'ASUSTeK' in (ansible_facts['chassis_vendor'] | default('')) %}
        [{"key": "STOP_CHARGE_THRESH_BAT0", "value": "80"}]
      {% elif 'Lenovo' in (ansible_facts['chassis_vendor'] | default('')) or 'ThinkPad' in (ansible_facts['chassis_vendor'] | default('')) %}
        [{"key": "START_CHARGE_THRESH_BAT0", "value": "75"}, {"key": "STOP_CHARGE_THRESH_BAT0", "value": "80"}]
      {% elif 'Huawei' in (ansible_facts['chassis_vendor'] | default('')) %}
        [{"key": "STOP_CHARGE_THRESH_BAT0", "value": "80"}]
      {% else %}
        []
      {% endif %}


- name: Batería | Iniciar y asegurar el servicio activo de TLP
  ansible.builtin.systemd_service:
    name: tlp.service
    enabled: true
    state: started
  notify: Reiniciar servicio TLP
  tags: [battery, power]
