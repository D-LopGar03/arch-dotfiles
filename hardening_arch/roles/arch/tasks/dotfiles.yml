---
- name: Asegurar que el directorio .config existe para el usuario
  ansible.builtin.file:
    path: "{{ entorno_home }}/.config"
    state: directory
    mode: '0755'
    owner: "{{ entorno_usuario }}"
    group: "{{ entorno_usuario }}"

- name: Crear enlaces simbólicos de los dotfiles en .config
  ansible.builtin.file:
    src: "{{ playbook_dir }}/../{{ item }}"
    dest: "{{ entorno_home }}/.config/{{ item }}"
    state: link
    force: yes
    owner: "{{ entorno_usuario }}"
    group: "{{ entorno_usuario }}"
  loop: "{{ dotfiles_config_links }}"

- name: Descargar repositorio de dotfiles desde GitHub
  ansible.builtin.git:
    repo: 'https://github.com/jvc84/wayves'
    dest: /home/{{ entorno_usuario }}/arch-dotfiles
    version: main
    update: yes
    submodules: yes # <-- CRUCIAL: Fuerza a Ansible a descargar todos los .gitmodules automáticamente
  become: no