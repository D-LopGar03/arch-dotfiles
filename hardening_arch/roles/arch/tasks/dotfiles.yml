---
- name: Limpieza | Eliminar configuraciones previas en .config
  ansible.builtin.file:
    path: "/home/{{ entorno_usuario }}/.config/{{ item }}"
    state: absent
  loop:
    - hypr
    - kitty
    - ranger
    - rofi
    - swaync
    - waybar
    - wallpapers
    - scripts
  tags: [dotfiles, limpieza]

- name: Copiar carpetas de configuración a .config de forma definitiva
  ansible.builtin.copy:
    src: "/home/{{ entorno_usuario }}/arch-dotfiles/{{ item }}"
    dest: "/home/{{ entorno_usuario }}/.config/"
    remote_src: yes  
    owner: "{{ entorno_usuario }}"
    group: "{{ entorno_usuario }}"
    mode: '0700'    
  loop:
    - hypr
    - kitty
    - ranger
    - rofi
    - swaync
    - waybar
    - wallpapers
    - scripts
  notify: Recargar Hyprland 
  tags: [dotfiles, copia]


- name: Descargar wayves desde GitHub
  ansible.builtin.git:
    repo: 'https://github.com/jvc84/wayves'
    dest: /home/{{ entorno_usuario }}/arch-dotfiles/scripts/wayves 
    version: main
    update: yes
    recursive: yes
    force: yes
  become: no

- name: Pywal | Asegurar el directorio de caché de Pywal para el usuario
  ansible.builtin.file:
    path: "/home/{{ entorno_usuario }}/.cache/wal"
    state: directory
    owner: "{{ entorno_usuario }}"
    group: "{{ entorno_usuario }}"
    mode: '0700'
  tags: [dotfiles, pywal]

- name: Pywal | Pregenerar la caché de la paleta de colores para el GIF con awww
  ansible.builtin.command:
    cmd: "wal -i /home/{{ entorno_usuario }}/arch-dotfiles/wallpapers/gifs/4167709.gif -n"
  become: no  
  changed_when: true
  failed_when: false 
  tags: [dotfiles, pywal]

- name: Awww | Detectar el socket de Wayland activo
  ansible.builtin.shell: |
    ls -1 /run/user/{{ ansible_facts['effective_user_id'] }}/wayland-* | head -n 1 | xargs basename
  register: socket_wayland_detectado
  changed_when: false
  failed_when: false

- name: Awww | Establecer el GIF animado como fondo de pantalla activo
  ansible.builtin.command:
    cmd: "awww img /home/{{ entorno_usuario }}/arch-dotfiles/wallpapers/gifs/4167709.gif"
  environment:
    WAYLAND_DISPLAY: "{{ socket_wayland_detectado.stdout | default('wayland-1') }}"
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['effective_user_id'] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts['effective_user_id'] }}/bus"
  become: yes
  become_user: "{{ entorno_usuario }}"
  changed_when: true
  failed_when: false 
  tags: [dotfiles, awww, wallpaper]


