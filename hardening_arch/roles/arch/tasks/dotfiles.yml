---
- name: Limpieza | Forzar la eliminación de carpetas físicas existentes para evitar bloqueos
  ansible.builtin.command:
    cmd: "rm -rf /home/{{ entorno_usuario }}/.config/{{ item }}"
  loop:
    - hypr
    - kitty
    - ranger
    - rofi
    - swaync
    - waybar
    - wallpapers
  changed_when: true
  tags: [dotfiles, hyprland]

- name: Crear enlaces simbólicos de los dotfiles en .config
  ansible.builtin.file:
    src: "/home/{{ entorno_usuario }}/arch-dotfiles/.config/{{ item }}"
    dest: "/home/{{ entorno_usuario }}/.config/{{ item }}"
    state: link
    force: yes
    owner: "{{ entorno_usuario }}"
    group: "{{ entorno_usuario }}"
  loop:
    - hypr
    - kitty
    - ranger
    - rofi
    - swaync
    - waybar
    - wallpapers
  tags: [dotfiles, hyprland]


- name: Descargar repositorio de dotfiles desde GitHub
  ansible.builtin.git:
    repo: 'https://github.com/jvc84/wayves'
    dest: /home/{{ entorno_usuario }}/arch-dotfiles
    version: main
    update: yes
    submodules: yes # <-- CRUCIAL: Fuerza a Ansible a descargar todos los .gitmodules automáticamente
  become: no