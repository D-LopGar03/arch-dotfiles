---
- name: Instalar paquetes del sistema vía Pacman
  ansible.builtin.package:
    name: "{{ pacman_packages }}"
    state: present
  become: yes  # Requiere root

- name: Instalar paquetes de AUR usando yay
  kewlfft.aur.aur:
    name: "{{ aur_packages }}"
    state: present
    user: "{{ ansible_user_id }}" # yay no debe correr como root
  become: no

- name: Asegurar que el repositorio Flathub está configurado
  community.general.flatpak_remote:
    name: flathub
    state: present
    method: user
    url: https://flathub.org
  become: no

- name: Instalar aplicaciones Flatpak (a nivel de usuario)
  community.general.flatpak:
    name: "{{ flatpak_packages }}"
    state: present
    method: user
  become: no

