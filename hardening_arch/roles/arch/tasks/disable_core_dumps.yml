---

- name: Core Dumps | Crear el directorio de configuración de coredump
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Prevenir el almacenamiento de Core Dumps en los servicios de systemd
  ansible.builtin.copy:
    dest: /etc/systemd/coredump.conf.d/disable.conf
    content: |
      [Coredump]
      Storage=none
      ProcessSizeMax=0
    owner: root
    group: root
    mode: '0644'

- name: Core Dumps | Limitar core dumps a 0 para todos los usuarios
  ansible.builtin.lineinfile:
    path: /etc/security/limits.d/99-coredump.conf
    line: '* hard core 0'
    create: true
    owner: root
    group: root
    mode: '0644'